version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring-platform:
        patterns:
          - "org.springframework.boot:spring-boot-starter-parent"
          - "org.springdoc:springdoc-openapi-starter-webmvc-ui"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
