spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
